[tool.poetry]
name = "llming-models"
version = "0.1.0"
description = "LLM execution engine — multi-provider streaming, MCP tools, and budget management"
authors = ["Michael Ikemann"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Alyxion/llming-models"
homepage = "https://github.com/Alyxion/llming-models"
keywords = ["llm", "models", "mcp", "openai", "anthropic", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.12",
]
packages = [{include = "llming_models"}]

[tool.poetry.urls]
"Author" = "https://github.com/Alyxion"

[tool.poetry.dependencies]
python = ">=3.12"

# Core
pydantic = "*"
tiktoken = "*"

# LLM providers
openai = ">=2.14"
anthropic = "*"
google-genai = ">=1.56"

# MCP (Model Context Protocol)
mcp = ">=1.0"

# Optional
pymongo = {version = ">=4.16", optional = true}

[tool.poetry.extras]
mongodb = ["pymongo"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
