[tool.poetry]
name = "llming-models"
version = "0.1.1"
description = "LLM execution engine — multi-provider streaming, MCP tools, and budget management"
authors = ["Michael Ikemann"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Alyxion/llming-models"
homepage = "https://github.com/Alyxion/llming-models"
keywords = ["llm", "models", "mcp", "openai", "anthropic", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.14",
]
packages = [{include = "llming_models"}]

[tool.poetry.urls]
"Author" = "https://github.com/Alyxion"

[tool.poetry.dependencies]
python = ">=3.14"

# Core
pydantic = "*"
tiktoken = "*"

# LLM providers
openai = ">=2.14"
anthropic = "*"
google-genai = ">=1.56"

# HTTP client (ElevenLabs TTS)
httpx = ">=0.27"

# MCP (Model Context Protocol)
mcp = ">=1.0"

# Optional
pymongo = {version = ">=4.16", optional = true}

[tool.poetry.extras]
mongodb = ["pymongo"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5.0"
mypy = ">=1.10"
python-dotenv = "*"
numpy = "^2.4.3"
sympy = "^1.14.0"
scipy = "^1.17.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = false
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
show_error_codes = true
plugins = ["pydantic.mypy"]
disable_error_code = [
    "no-untyped-def",
    "no-untyped-call",
    "type-arg",
    "no-any-return",
]

[[tool.mypy.overrides]]
module = [
    "mcp.*",
    "google.*",
    "tiktoken.*",
    "pymongo.*",
    "httpx.*",
    "aiohttp.*",
    "dotenv.*",
    "sympy.*",
    "numpy.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["llming_models"]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "^\\s*pass\\s*$",
    "if __name__.*__main__",
    "\\.\\.\\.",
]
exclude_also = [
    "def __repr__",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
