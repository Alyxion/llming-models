site_name: llming-models
site_description: LLM execution engine — multi-provider streaming, MCP tools, and budget management
site_url: https://alyxion.github.io/llming-models
repo_url: https://github.com/Alyxion/llming-models
repo_name: Alyxion/llming-models

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Chat Playground: getting-started/playground.md
  - Providers:
    - Overview: providers/overview.md
    - OpenAI: providers/openai.md
    - Anthropic: providers/anthropic.md
    - Google Gemini: providers/google.md
    - Mistral: providers/mistral.md
    - Together AI: providers/together.md
    - Azure: providers/azure.md
  - Media (TTS/STT):
    - Overview: media/overview.md
    - OpenAI TTS/STT: media/openai.md
    - ElevenLabs: media/elevenlabs.md
    - Adding Providers: media/custom.md
  - Core Concepts:
    - Chat Sessions: concepts/sessions.md
    - Budget Management: concepts/budget.md
    - Tool System: concepts/tools.md
    - MCP Integration: concepts/mcp.md
    - Configuration: concepts/config.md
  - API Reference:
    - Models: api/models.md
    - Providers: api/providers.md
    - Media: api/media.md
    - Budget: api/budget.md
